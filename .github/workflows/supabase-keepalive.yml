name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 12 */5 * *'   # every 5 days at noon UTC
  workflow_dispatch:           # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://lilsamzsvywofdpwrlts.supabase.co/health)
          echo "Supabase health check status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "Project is alive."
          else
            echo "Unexpected status: $STATUS"
            exit 1
          fi
