name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 12 */5 * *'   # every 5 days at noon UTC
  workflow_dispatch:           # allow manual trigger

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write Supabase heartbeat row and record heartbeat
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # History: a plain /health ping didn't stop the 2026-08-10 pause (edge
          # network only, never touches Postgres). Its replacement, an anon READ
          # of `vehicles`, returned 200 [] every run, and the project paused for
          # inactivity anyway on 2026-09-30, 4 days after a successful ping. So
          # this now WRITES: it updates pinged_at on the one-row keepalive table
          # (migration 007). Anon may update only that column on that row.
          NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          BODY=$(curl -s -w "\n%{http_code}" -X PATCH \
            "https://lilsamzsvywofdpwrlts.supabase.co/rest/v1/keepalive?id=eq.1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"pinged_at\": \"$NOW\"}")
          STATUS=$(echo "$BODY" | tail -n1)
          RESPONSE=$(echo "$BODY" | sed '$d')
          echo "Supabase heartbeat write status: $STATUS"
          echo "Response: $RESPONSE"
          # The old check accepted anything below 500, so a 401/403 would have
          # logged as "alive". Require a real 200 with the updated row returned
          # (an RLS/grant miss returns 200 [] - zero rows updated - or 4xx).
          if [ "$STATUS" != "200" ] || ! echo "$RESPONSE" | grep -q '"id":1'; then
            echo "Heartbeat write failed (status $STATUS)."
            exit 1
          fi
          echo "Project is alive."

          # GitHub auto-disables scheduled workflows after 60 days of no repo
          # activity - a successful Actions run doesn't count, only commits
          # do. Committing this heartbeat file keeps the repo "active" so
          # this workflow (and the Supabase project it's keeping alive) never
          # gets silently disabled again without manual intervention.
          echo "Last successful ping: $(date -u +'%Y-%m-%dT%H:%M:%SZ') (HTTP $STATUS)" > .github/keepalive-last-ping.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive-last-ping.txt
          git commit -m "chore: keep-alive heartbeat"
          git push
