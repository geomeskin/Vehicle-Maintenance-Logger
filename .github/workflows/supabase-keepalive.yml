name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 12 */5 * *'   # every 5 days at noon UTC
  workflow_dispatch:           # allow manual trigger

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Query Supabase and record heartbeat
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # A plain /health ping only checks the edge network, not the database -
          # it kept reporting success every run while Supabase paused the project
          # anyway (found 2026-08-10). Supabase's inactivity timer tracks real
          # database/API usage, so this queries an actual table through PostgREST
          # instead. RLS means an anon key gets back an empty array rather than
          # real rows - that's fine, a 200 here still means Postgres was touched.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://lilsamzsvywofdpwrlts.supabase.co/rest/v1/vehicles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase table query status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 500 ]; then
            echo "Unexpected status: $STATUS"
            exit 1
          fi
          echo "Project is alive."

          # GitHub auto-disables scheduled workflows after 60 days of no repo
          # activity - a successful Actions run doesn't count, only commits
          # do. Committing this heartbeat file keeps the repo "active" so
          # this workflow (and the Supabase project it's keeping alive) never
          # gets silently disabled again without manual intervention.
          echo "Last successful ping: $(date -u +'%Y-%m-%dT%H:%M:%SZ') (HTTP $STATUS)" > .github/keepalive-last-ping.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive-last-ping.txt
          git commit -m "chore: keep-alive heartbeat"
          git push
